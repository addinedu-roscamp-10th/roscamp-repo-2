name: tat5_to_control_bridge
from_domain: 15
to_domain: 100

topics:
  /map:
    type: nav_msgs/msg/OccupancyGrid
    remap: /TAT5/map

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /TAT5/battery/percent

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /TAT5/amcl_pose

  /plan:
    type: nav_msgs/msg/Path
    remap: /TAT5/plan

  /TAT5/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 15
    remap: /initialpose

  /TAT5/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 15
    remap: /goal_pose
