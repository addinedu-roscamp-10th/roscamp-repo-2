name: tat2_to_control_bridge
from_domain: 12
to_domain: 100

topics:
  /map:
    type: nav_msgs/msg/OccupancyGrid
    remap: /TAT2/map

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /TAT2/battery/percent

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /TAT2/amcl_pose

  /plan:
    type: nav_msgs/msg/Path
    remap: /TAT2/plan

  /TAT2/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 12
    remap: /initialpose

  /TAT2/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 12
    remap: /goal_pose
