name: tat4_to_control_bridge
from_domain: 14
to_domain: 100

topics:
  /map:
    type: nav_msgs/msg/OccupancyGrid
    remap: /TAT4/map

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /TAT4/battery/percent

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /TAT4/amcl_pose

  /plan:
    type: nav_msgs/msg/Path
    remap: /TAT4/plan

  /TAT4/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 14
    remap: /initialpose

  /TAT4/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 14
    remap: /goal_pose
