name: tat3_to_control_bridge
from_domain: 13
to_domain: 100

topics:
  /map:
    type: nav_msgs/msg/OccupancyGrid
    remap: /TAT3/map

  /battery/percent:
    type: std_msgs/msg/Float32
    remap: /TAT3/battery/percent

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /TAT3/amcl_pose

  /plan:
    type: nav_msgs/msg/Path
    remap: /TAT3/plan

  /TAT3/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 13
    remap: /initialpose

  /TAT3/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 13
    remap: /goal_pose
